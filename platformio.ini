; CYD 4.0" (ESP32-32E, ST7796 320x480, XPT2046 resistive touch) multi-tool firmware
; Build:  pio run          Flash: pio run -t upload        Monitor: pio device monitor

[env:cyd40]
; espressif32 6.9.0 == Arduino-ESP32 core 2.0.17 (legacy I2S driver, needed for the built-in DAC)
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
  -O2
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
lib_deps =
  lovyan03/LovyanGFX@1.1.16
  h2zero/NimBLE-Arduino@1.4.2
  earlephilhower/ESP8266Audio@1.9.7
  bblanchon/ArduinoJson@7.2.1
